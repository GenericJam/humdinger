    for (var w = 0; w < 16; w++) { var on = w === 9; whites.push({ l: Math.round(w * colW), t: on ? 2 : 0, w: Math.round(colW - 3), bg: on ? '#A98BFF' : '#ECE7F2' }); }
    var blacks = [0, 1, 2, 4, 5, 7, 8, 9, 11, 12, 14].map(function (i) { return { l: Math.round((i + 1) * colW - 17.5) }; });
    return { btns: btns, whites: whites, blacks: blacks };
  }
}
