      <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; display: flex; align-items: center; gap: 1px"><sc-for list="{{wave}}" as="w" hint-placeholder-count="110"><span style="flex: 1; height: {{w.h}}%; background: {{w.c}}"></span></sc-for></div>
      <div style="position: absolute; left: {{sel.l}}px; width: {{sel.w}}px; top: -4px; bottom: -4px; border-radius: 6px; box-shadow: inset 0 0 0 2px #F3EFF8"></div>
      <div style="position: absolute; left: {{sel.hl}}px; top: 13px; width: 10px; height: 28px; border-radius: 4px; background: #F3EFF8"></div>
      <div style="position: absolute; left: {{sel.hr}}px; top: 13px; width: 10px; height: 28px; border-radius: 4px; background: #F3EFF8"></div>
    </div>
    <div style="display: flex; justify-content: space-between; font: 500 11px 'JetBrains Mono', monospace; color: #A9A3B8"><span>using 0:09 – 0:21</span><span>drag to choose the part</span></div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 14px; background: #1C1925">
    <dc-import note="64" mood="soft" size="0.7" hint-size="45px,39px" name="Blob"></dc-import>
    <div style="flex: 1; line-height: 1.35"><div style="font-size: 14px; font-weight: 700">Heard 14 notes</div><div style="font: 500 11px 'JetBrains Mono', monospace; color: #A9A3B8">E minor · 84 bpm · one voice</div></div>
    <span style="padding: 4px 8px; border-radius: 8px; background: #24301A; color: #C6F24E; font: 600 11px Inter, sans-serif">clear</span>
  </div>

  <div style="position: relative; height: 210px; border-radius: 16px; background: #1C1925; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="10"><div style="position: absolute; left: 0; right: 0; top: {{r.t}}px; height: 20px; background: {{r.bg}}"><span style="position: absolute; left: 6px; top: 5px; font: 600 9px/1 'JetBrains Mono', monospace; color: #A9A3B8">{{r.name}}</span></div></sc-for>
    <svg width="350" height="210" sc-camel-view-box="0 0 350 210" style="position: absolute; left: 0; top: 0" aria-hidden="true"><path d="{{trace}}" fill="none" stroke="#F3EFF8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"></path></svg>
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="14"><div style="position: absolute; left: {{n.l}}px; top: {{n.t}}px; width: {{n.w}}px; height: 16px; border-radius: 5px; background: {{n.c}}; opacity: {{n.o}}"></div></sc-for>
    <span style="position: absolute; right: 8px; bottom: 8px; padding: 4px 8px; border-radius: 8px; background: #14121A; font: 600 10px 'JetBrains Mono', monospace; color: #FFB547">2 unsure · faded</span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 74px; font-size: 13px; font-weight: 600">Snap</span>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925">
        <span style="height: 36px; border-radius: 9px; background: #34304A; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">E minor ▾</span>
        <span style="height: 36px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; color: #A9A3B8">Chromatic</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 74px; font-size: 13px; font-weight: 600">Quantize</span>
      <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925">
        <sc-for list="{{quant}}" as="q" hint-placeholder-count="4"><span style="height: 36px; border-radius: 9px; background: {{q.bg}}; color: {{q.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600">{{q.t}}</span></sc-for>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 8px">
      <span style="width: 74px; font-size: 13px; font-weight: 600">Ignore</span>
      <div style="flex: 1; height: 42px; border-radius: 12px; background: #1C1925; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 12px"><span style="color: #A9A3B8">notes shorter than</span><span style="font-family: 'JetBrains Mono', monospace">60 ms</span></div>
    </div>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
    <a href="Record.dc.html" style="height: 54px; border-radius: 16px; background: #C6F24E; color: #14121A; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 700 16px Inter, sans-serif">Edit as a phrase</a>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 46px; border-radius: 14px; border: none; background: #2A2636; color: #F3EFF8; font: 600 13px Inter, sans-serif">Export .mid</button>
      <a href="Staff.dc.html" style="height: 46px; border-radius: 14px; background: #2A2636; color: #F3EFF8; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif">Sheet music</a>
      <button type="button" style="height: 46px; border-radius: 14px; border: none; background: #2A2636; color: #F3EFF8; font: 600 13px Inter, sans-serif">Play out</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    var hue = function (m) { return 'hsl(' + Math.round((m - 21) / 87 * 300) + ', 72%, 62%)'; };
    var seed = 4, rnd = function () { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    var wave = [];
    for (var i = 0; i < 110; i++) { var inSel = i >= 26 && i < 61; var amp = (i % 9 < 6 ? 0.55 : 0.12) * (0.6 + 0.6 * rnd()); wave.push({ h: Math.max(4, Math.round(amp * 100)), c: inSel ? '#C6F24E' : '#4A4560' }); }
    var W = 330, cw = W / 110;
    var sel = { l: Math.round(26 * cw) - 2, w: Math.round(35 * cw) + 4, hl: Math.round(26 * cw) - 7, hr: Math.round(61 * cw) - 3 };
    var NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    var rowsM = [74, 72, 71, 69, 67, 66, 64, 62, 60, 59];
    var rows = rowsM.map(function (m, i) { return { t: 5 + i * 20, name: NAMES[m % 12] + (Math.floor(m / 12) - 1), bg: i % 2 ? '#1F1C29' : '#221F2D' }; });
    var yOf = function (m) { return 5 + rowsM.indexOf(m) * 20 + 10; };
    var x0 = 30, u = (350 - x0 - 8) / 28;
    var seq = [[0, 2, 64], [2, 1, 67], [3, 1, 69], [4, 3, 71], [7, 1, 72], [8, 2, 71], [10, 2, 69], [12, 1, 67], [13, 1, 66, 0.4], [14, 4, 64], [18, 2, 62], [20, 2, 64], [22, 1, 59, 0.4], [23, 5, 64]];
    var notes = seq.map(function (s) { return { l: Math.round(x0 + s[0] * u) + 1, t: Math.round(yOf(s[2]) - 8), w: Math.round(s[1] * u) - 3, c: hue(s[2]), o: s[3] || 1 }; });
    var pts = [];
    seq.forEach(function (s) { var y = yOf(s[2]); pts.push([x0 + s[0] * u + 2, y + (rnd() - 0.5) * 6]); pts.push([x0 + (s[0] + s[1]) * u - 2, y + (rnd() - 0.5) * 6]); });
    var trace = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var quant = ['1/8', '1/16', 'Triplet', 'Off'].map(function (t) { var on = t === '1/16'; return { t: t, bg: on ? '#34304A' : 'transparent', fg: on ? '#F3EFF8' : '#A9A3B8' }; });
    return { wave: wave, sel: sel, rows: rows, notes: notes, trace: trace, quant: quant };
  }
}
</script>
