<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Live.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#F3EFF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; flex: 1; font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 800">Send MIDI to</h1>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <sc-for list="{{dests}}" as="d" hint-placeholder-count="4">
      <div style="border-radius: 16px; background: #1C1925; padding: 12px 14px; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 0 0 {{d.ringW}}px #C6F24E">
        <span style="width: 40px; height: 40px; border-radius: 12px; background: #2A2636; display: flex; align-items: center; justify-content: center; flex: none; font: 700 11px/1 'JetBrains Mono', monospace; color: {{d.iconC}}">{{d.icon}}</span>
        <div style="flex: 1; min-width: 0; line-height: 1.3"><div style="font-size: 15px; font-weight: 700">{{d.name}}</div><div style="font: 500 11px/1.4 'JetBrains Mono', monospace; color: #A9A3B8">{{d.sub}}</div></div>
        <span role="switch" aria-checked="{{d.aria}}" aria-label="{{d.name}}" style="width: 48px; height: 28px; border-radius: 14px; background: {{d.bg}}; position: relative; flex: none"><span style="position: absolute; left: {{d.kl}}px; top: 3px; width: 22px; height: 22px; border-radius: 11px; background: {{d.kc}}"></span></span>
      </div>
    </sc-for>
    <div style="display: flex; gap: 8px">
      <a href="Connect.dc.html" style="flex: 1; height: 44px; border-radius: 12px; background: #2A2636; color: #F3EFF8; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif">Pair FMutate · QR or code</a>
      <button type="button" style="flex: 1; height: 44px; border-radius: 12px; border: none; background: #2A2636; color: #F3EFF8; font: 600 13px Inter, sans-serif">Scan Bluetooth</button>
    </div>
  </div>

  <section style="border-radius: 16px; background: #1C1925; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0; font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: #A9A3B8">CHANNEL</h2>
    <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{chans}}" as="c" hint-placeholder-count="16"><button type="button" style="height: 36px; border-radius: 8px; border: none; background: {{c.bg}}; color: {{c.fg}}; font: 600 12px 'JetBrains Mono', monospace">{{c.n}}</button></sc-for>
    </div>
  </section>

  <section style="border-radius: 16px; background: #1C1925; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
    <h2 style="margin: 0; font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: 0.08em; color: #A9A3B8">WHAT GETS SENT</h2>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <span style="padding: 5px 9px; border-radius: 8px; background: #2A2636; font: 600 11px/1.2 'JetBrains Mono', monospace">note on / off</span>
