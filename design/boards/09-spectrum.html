<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 12px">
  <div style="display: flex; align-items: center; gap: 12px">
    <dc-import note="69" mood="soft" size="1" hint-size="55px,55px" name="Blob"></dc-import>
    <div style="flex: 1; display: flex; align-items: baseline; gap: 10px"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; line-height: 1; color: {{noteC}}">A4</span><span style="font: 600 12px/1 'JetBrains Mono', monospace; color: #A9A3B8">440 Hz · −12¢</span></div>
  </div>

  <div role="tablist" aria-label="Lane view" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925">
    <a href="Live.dc.html" role="tab" aria-selected="false" style="height: 38px; border-radius: 9px; color: #A9A3B8; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif">Notes</a>
    <span role="tab" aria-selected="true" style="height: 38px; border-radius: 9px; background: #34304A; display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif">Spectrum</span>
  </div>

  <div style="position: relative; height: 470px; border-radius: 16px; background: #1C1925; overflow: hidden">
    <sc-for list="{{cells}}" as="c" hint-placeholder-count="200"><div style="position: absolute; left: {{c.l}}px; top: {{c.t}}px; width: {{c.w}}px; height: {{c.h}}px; background: {{c.c}}"></div></sc-for>
    <svg width="350" height="470" sc-camel-view-box="0 0 350 470" style="position: absolute; left: 0; top: 0" aria-hidden="true"><path d="{{trace}}" fill="none" stroke="{{noteC}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    <sc-for list="{{axis}}" as="a" hint-placeholder-count="5"><span style="position: absolute; left: 6px; top: {{a.t}}px; font: 600 10px/1 'JetBrains Mono', monospace; color: #A9A3B8">{{a.label}}</span></sc-for>
    <sc-for list="{{harm}}" as="h" hint-placeholder-count="3"><span style="position: absolute; right: 8px; top: {{h.t}}px; padding: 2px 5px; border-radius: 5px; background: #14121A; font: 600 10px/1 'JetBrains Mono', monospace; color: {{h.c}}">{{h.label}}</span></sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; font-size: 12px; color: #C9C3D6">
    <span style="display: flex; gap: 2px"><sc-for list="{{ramp}}" as="r" hint-placeholder-count="5"><span style="width: 18px; height: 10px; background: {{r}}"></span></sc-for></span>
    <span>quiet → loud</span>
    <span style="margin-left: auto; display: flex; align-items: center; gap: 6px"><span style="width: 16px; height: 3px; border-radius: 2px; background: {{noteC}}"></span>pitch it heard</span>
  </div>
  <p style="margin: 0; font-size: 12px; line-height: 1.45; color: #A9A3B8">Your voice is a stack of bright lines. The lowest is the note; the ones above (×2, ×3…) are harmonics that give it its colour. If the coloured line jumps to a harmonic, try a softer, rounder vowel like “oo”.</p>

<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    var W = 350, H = 470, COLS = 35, ROWS = 47, cw = W / COLS, ch = H / ROWS;
    var fLo = 80, fHi = 2400, L0 = Math.log(fLo), L1 = Math.log(fHi);
    var yOfF = function (f) { return H - (Math.log(f) - L0) / (L1 - L0) * H; };
    var f0At = function (c) {
      var t = c / (COLS - 1);
      if (t < 0.08) return 0;
      if (t < 0.38) return 294 * (1 + 0.004 * Math.sin(c * 1.7));
      if (t < 0.45) return 294 + (t - 0.38) / 0.07 * (392 - 294);
      if (t < 0.66) return 392 * (1 + 0.005 * Math.sin(c * 1.9));
      if (t < 0.72) return 392 + (t - 0.66) / 0.06 * (440 - 392);
      return 440 * (1 + 0.006 * Math.sin(c * 2.1));
    };
    var shades = ['#1C1925', '#2A2240', '#3E2F7A', '#6A52C9', '#B9A2FF', '#F3EFF8'];
    var cells = [];
    for (var c = 0; c < COLS; c++) {
      var f0 = f0At(c);
      for (var r = 0; r < ROWS; r++) {
        var fr = Math.exp(L0 + (ROWS - r - 0.5) / ROWS * (L1 - L0)), I = 0;
        if (f0 > 0) {
          for (var k = 1; k <= 8; k++) {
            var d = (Math.log(fr) - Math.log(k * f0)) / 0.045;
            var formant = 1 + 0.8 * Math.exp(-Math.pow((Math.log(fr) - Math.log(700)) / 0.35, 2));
            I += Math.exp(-d * d) * Math.pow(k, -0.7) * formant;
          }
        } else if (fr > 900) { I = 0.18 * ((c * 7 + r * 13) % 5) / 4; }
        var lvl = I > 1.1 ? 5 : I > 0.7 ? 4 : I > 0.4 ? 3 : I > 0.2 ? 2 : I > 0.08 ? 1 : 0;
        if (lvl > 0) cells.push({ l: (c * cw).toFixed(1), t: (r * ch).toFixed(1), w: (cw + 0.5).toFixed(1), h: (ch + 0.5).toFixed(1), c: shades[lvl] });
      }
    }
    var pts = [];
    for (var c2 = 3; c2 < COLS; c2++) { var f = f0At(c2); if (f > 0) pts.push([(c2 + 0.5) * cw, yOfF(f)]); }
    var trace = pts.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ');
    var axis = [100, 200, 400, 800, 1600].map(function (f) { return { label: f >= 1000 ? (f / 1000) + 'k' : String(f), t: Math.round(yOfF(f) - 5) }; });
    var harm = [[1, 'note', '#F3EFF8'], [2, '×2', '#C9C3D6'], [3, '×3', '#C9C3D6']].map(function (h) { return { label: h[1], c: h[2], t: Math.round(yOfF(440 * h[0]) - 8) }; });
    var hue = 'hsl(' + Math.round((69 - 21) / 87 * 300) + ', 72%, 62%)';
    return { cells: cells, trace: trace, axis: axis, harm: harm, ramp: shades.slice(1), noteC: hue };
  }
}
