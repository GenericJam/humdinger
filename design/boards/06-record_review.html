<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #14121A; color: #F3EFF8; font-family: Inter, sans-serif; overflow: hidden; padding: 12px 20px 22px; display: flex; flex-direction: column; gap: 14px">
  <div style="display: flex; align-items: center; gap: 8px">
    <a href="Live.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#F3EFF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; line-height: 1.2"><h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 800">New phrase</h1><div style="font: 500 11px/1.4 'JetBrains Mono', monospace; color: #A9A3B8">8 notes · 2 bars at 96 · D Dorian</div></div>
    <button type="button" style="height: 40px; padding: 0 12px; border-radius: 12px; border: none; background: #1C1925; color: #F3EFF8; font: 600 13px Inter, sans-serif">Hum again</button>
  </div>

  <div role="tablist" aria-label="Phrase view" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925">
    <span role="tab" aria-selected="true" style="height: 38px; border-radius: 9px; background: #34304A; display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif">Piano roll</span>
    <a href="Staff.dc.html" role="tab" aria-selected="false" style="height: 38px; border-radius: 9px; color: #A9A3B8; text-decoration: none; display: flex; align-items: center; justify-content: center; font: 600 13px Inter, sans-serif">Staff</a>
  </div>

  <div style="position: relative; height: 312px; border-radius: 16px; background: #1C1925; overflow: hidden">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="12"><div style="position: absolute; left: 0; right: 0; top: {{r.t}}px; height: 26px; background: {{r.bg}}"><span style="position: absolute; left: 6px; top: 8px; font: 600 10px/1 'JetBrains Mono', monospace; color: #A9A3B8">{{r.name}}</span></div></sc-for>
    <sc-for list="{{beats}}" as="b" hint-placeholder-count="9"><div style="position: absolute; top: 0; bottom: 0; left: {{b.l}}px; width: {{b.w}}px; background: #34304A"></div></sc-for>
    <svg width="350" height="320" sc-camel-view-box="0 0 350 320" style="position: absolute; left: 0; top: 0" aria-hidden="true"><path d="{{trace}}" fill="none" stroke="#F3EFF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"></path></svg>
    <sc-for list="{{notes}}" as="n" hint-placeholder-count="8"><div style="position: absolute; left: {{n.l}}px; top: {{n.t}}px; width: {{n.w}}px; height: 22px; border-radius: 6px; background: {{n.bg}}; box-shadow: inset 0 0 0 {{n.ringW}}px #F3EFF8"></div></sc-for>
    <div style="position: absolute; left: {{sel.l1}}px; top: {{sel.t}}px; width: 6px; height: 30px; border-radius: 3px; background: #F3EFF8"></div>
    <div style="position: absolute; left: {{sel.l2}}px; top: {{sel.t}}px; width: 6px; height: 30px; border-radius: 3px; background: #F3EFF8"></div>
  </div>
  <p style="margin: -4px 0 0; font-size: 12px; line-height: 1.4; color: #A9A3B8">Drag a note up or down to fix it; drag its ends to change length. The faint line is what you actually sang.</p>

  <div style="display: flex; align-items: center; gap: 8px">
    <span style="font-size: 13px; font-weight: 600; width: 64px">Quantize</span>
    <div style="flex: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px; padding: 3px; border-radius: 12px; background: #1C1925">
      <sc-for list="{{quant}}" as="q" hint-placeholder-count="4"><button type="button" style="height: 38px; border-radius: 9px; border: none; background: {{q.bg}}; color: {{q.fg}}; font: 600 13px Inter, sans-serif">{{q.t}}</button></sc-for>
