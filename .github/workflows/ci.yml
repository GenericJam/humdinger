name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: '1.20.0-otp-29'
            otp: '29.1.2'
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}
          version-type: strict
          install-hex: true
          install-rebar: true

      - name: Cache compiled build artifacts
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-${{ runner.os }}-${{ env.MIX_ENV }}-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ env.MIX_ENV }}-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Format check
        run: mix format --check-formatted

      - name: Credo (strict)
        run: mix credo --strict

      - name: Tests
        run: mix test

  c-host:
    name: Host C DSP harnesses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and run pitch_host
        run: |
          cc -O2 -o /tmp/pitch_host c_src/test/pitch_host.c -lm
          /tmp/pitch_host synth

      - name: Build and run spectrum_host
        run: |
          cc -O2 -o /tmp/spectrum_host c_src/test/spectrum_host.c -lm
          /tmp/spectrum_host
